name: Release

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'fxmanifest.lua'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.meta.outputs.should_release }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Detect fxmanifest version change
        id: meta
        run: |
          CURRENT=$(grep -E '^version ' fxmanifest.lua | sed -E "s/^version[[:space:]]+['\"]([^'\"]+)['\"].*/\1/")
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Manual run; releasing version $CURRENT"
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Initial or force push; releasing version $CURRENT"
            exit 0
          fi

          PREVIOUS=$(git show "$BEFORE:fxmanifest.lua" 2>/dev/null | grep -E '^version ' | sed -E "s/^version[[:space:]]+['\"]([^'\"]+)['\"].*/\1/" || true)
          if [ "$CURRENT" = "$PREVIOUS" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "fxmanifest changed but version is still $CURRENT; skipping release."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Version updated: ${PREVIOUS:-unknown} -> $CURRENT"
          fi

  release:
    runs-on: ubuntu-latest
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install web dependencies
        run: bun install --frozen-lockfile
        working-directory: web

      - name: Build NUI
        run: bun run build
        working-directory: web

      - name: Prepare release package
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          RELEASE_ROOT="release/ox_inventory"
          mkdir -p "$RELEASE_ROOT/web/build"

          # Copy the resource, excluding the web source (only web/build ships).
          rsync -a \
            --exclude '.git' \
            --exclude '.gitattributes' \
            --exclude '.gitignore' \
            --exclude '.github' \
            --exclude '.vscode' \
            --exclude '.editorconfig' \
            --exclude '.luarc.default.jsonc' \
            --exclude 'CONTRIBUTING.md' \
            --exclude 'release' \
            --exclude 'web' \
            --exclude 'node_modules' \
            ./ "$RELEASE_ROOT/"

          # Ship the compiled UI only (no src/, no node_modules, no build tooling).
          rsync -a web/build/ "$RELEASE_ROOT/web/build/"
          rsync -a web/images/ "$RELEASE_ROOT/web/images/"
          cp web/LICENSE "$RELEASE_ROOT/web/build/LICENSE"

      - name: Create zip archive
        run: |
          cd release
          zip -r "../ox_inventory.zip" ox_inventory

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: ox_inventory
          path: ox_inventory.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: v${{ needs.check-version.outputs.version }}
          files: ox_inventory.zip
          generate_release_notes: true
